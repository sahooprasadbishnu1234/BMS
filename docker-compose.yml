version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: bms_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bms_db
    ports:
      - "5432:5432"
    volumes:
      - bms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bms_pgdata:
    driver: local
